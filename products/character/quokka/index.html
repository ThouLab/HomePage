<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="site-base" content="/">
  <script>
    (function(){
      try{
        var meta = document.querySelector('meta[name="site-base"]');
        var manual = meta && meta.getAttribute('content') ? meta.getAttribute('content').trim() : '';
        var base = manual || null;

        if (!base){
          var host = location.hostname;
          var path = location.pathname;
          base = '/';
          if (host && host.endsWith('github.io')){
            var parts = path.split('/').filter(Boolean);
            if (parts.length > 0) base = '/' + parts[0] + '/';
          }
        }
        if (!base.endsWith('/')) base += '/';

        var el = document.createElement('base');
        el.href = base;
        document.head.appendChild(el);
        window.__SITE_BASE__ = base.replace(/\/$/, '');
      }catch(e){}
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>おまもりクオッカ！ | ThouLab</title>
  <meta name="description" content="どこか間の抜けたクオッカワラビーたち">

  <link rel="icon" href="/assets/img/logo_tab.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/products/character/quokka/style.css">
</head>

<body data-page="products" class="quokka-page">
  <div id="site-header"></div>

  <main id="main" class="container quokka-main">
    <div class="page-head reveal">
      <h1>おまもりクオッカ！</h1>
      <p>どこか間の抜けたクオッカワラビーたち</p>
    </div>

    <section class="section reveal" id="stamps">
      <div class="section-head">
        <div>
          <h2>LINEスタンプ配信中！</h2>
          <p class="sub">
            LINEスタンプ第一弾。販売中！
          </p>
        </div>
        <a class="btn primary" id="line-stamp-link" href="https://line.me/S/sticker/32551910?_from=lcm" target="_blank" rel="noopener">購入</a>
      </div>

      <div class="quokka-stamp-grid" id="stamp-grid" aria-label="スタンプ一覧"></div>

      <p>© Naoki Kobayashi</p>
    </section>

    <section class="section reveal" id="challenge">
      <div class="section-head">
        <div>
          <h2>クオッカからの挑戦状</h2>
          <p class="sub">
            折角のお出かけなのに渋滞にハマった！<br>
            そんな時に時間を忘れて考え込めるような問題を掲載中！
          </p>
        </div>
      </div>

      <div class="list" id="challenge-list">
        <div class="notice">読み込み中…</div>
      </div>
    </section>

    <!-- Lightbox（スタンプ拡大表示） -->
    <div class="quokka-lightbox" id="stamp-lightbox" aria-hidden="true" role="dialog" aria-label="スタンプ画像の拡大表示">
      <div class="quokka-lightbox__backdrop" data-close></div>
      <div class="quokka-lightbox__panel" role="document">
        <button class="icon-btn quokka-lightbox__close" type="button" data-close aria-label="閉じる">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <img id="lightbox-img" alt="">
        <p id="lightbox-caption" class="quokka-lightbox__caption"></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script defer src="/assets/js/main.js"></script>
  <script defer src="/products/character/quokka/app.js"></script>
</body>
</html>
